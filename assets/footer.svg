<clipPath id="c"><rect width="1000" height="130" rx="22"/></clipPath><linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#2563EB" stop-opacity=".55"/></linearGradient><linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB" stop-opacity=".45"/><stop offset="1" stop-color="#C026D3" stop-opacity=".4"/></linearGradient></defs><style>@font-face{font-family:'Pop';font-weight:500;src:url(data:font/woff;base64,) format('woff');}
