<clipPath id="c"><rect width="1000" height="104" rx="18"/></clipPath></defs><style>@font-face{font-family:'Pop';font-weight:400;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Pop';font-weight:700;src:url(data:font/woff;base64,) format('woff');}
